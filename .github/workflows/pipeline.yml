name: StackFit Job Pipeline

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: stackfit-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest
    environment: DISCORD_WEBHOOK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet and unit tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Run StackFit matcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          
        run: go run .

      - name: Persist seen_jobs.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "chore(state): update seen_jobs.json" && git push)
